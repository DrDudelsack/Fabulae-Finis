l_english:
 ## Twainist ##
 deity_twain:0 "$omen_twain$"
 omen_twain:0 "Twain"
 omen_twain_desc:0 "#Y Twainist Author#!\n\nBorn in Hannibal, Missouri, Mark Twain was the first and most influential of the Authors. He traveled all over America, taking in all her sights and beauties. His many novels reflect the experiences he had while traveling. It is commonly understood that Author Twain recieved his writing prowess due to his close nature with the Mississippi."
 deity_muir:0 "$omen_muir$"
 omen_muir:0 "Muir"
 omen_muir_desc:0 "#Y Twainist Author#!\n\nAuthor Muir was an early advocate for nature, and through many years of careful contemplation and meditation in the wilderness, he came to understand some of the destructive tendencies of Man. His teachings of the unbridled free spirit of the wilderness, and the ways Man can coexist with it are still relevant to this day."
 deity_columbia:0 "$omen_columbia$"
 omen_columbia:0 "Columbia"
 omen_columbia_desc:0 "#Y Twainist Goddess#!\n\nThe personification of the spirit of America, Columbia guides the people to prosperity. She is the goddess of Liberty, and represents the freedom all Men inherit."
 deity_mississippi:0 "$omen_mississippi$"
 omen_mississippi:0 "Mississippi"
 omen_mississippi_desc:0 "#Y Twainist Goddess#!\n\nThe two-faced goddess of the river that bears her name, Mississippi is a bestower of knowledge, life, and wealth. It is said that sometimes, you can find Mississippi standing at the banks of the Great River in St. Louis, one face looking west, and one face looking east."
 deity_whitman:0 "$omen_whitman$"
 omen_whitman:0 "Whitman"
 omen_whitman_desc:0 "#Y Twainist Author#!\n\nKnown as 'the Great American Poet', Author Whitman's works touched the hearts and minds of every American. Through his poetry, Author Whitman strives to tell us of deism - the idea that every creed and faith holds value and legitimacy, no matter how foreign."
 deity_the_comet:0 "omen_the_comet"
 omen_the_comet:0 "The Comet"
 omen_the_comet_desc:0 "#Y Twainist Aspect#!\n\nRepresentative of the cyclical nature of life, and to a greater extent fate, The Comet signals the start and end of important events. Author Twain was born and died on the passing of The Comet, and it is for this reason that Twainists look up to the skies for an omen, whether they interpret it as good or bad."
 deity_the_yankee:0 "omen_the_yankee"
 omen_the_yankee:0 "The Yankee"
 omen_the_yankee_desc:0 "#Y Twainist Aspect#!\n\nThe crass, revolver bearing Yankee is a genius engineer, and a staunch proponent of democracy. He works solely for the benefit of the common man, and strikes down all who oppose him."
 deity_the_pilot:0 "omen_the_pilot"
 omen_the_pilot:0 "The Pilot"
 omen_the_pilot_desc:0 "#Y Twainist Aspect#!\n\nThe Pilot is the one who controls and steadies the waters of the Mississippi. Without him, the flow of the Great River would be unpredictable and dangerous. He is revered by ship captains and merchants, and is seen as a protector of them."
 deity_the_king:0 "omen_the_king"
 omen_the_king:0 "The King"
 omen_the_king_desc:0 "#Y Twainist Aspect#!\n\nAlthough somewhat mired in the past, The King is a just and fair man. He represents the idyllic and antique nature of Pre-Event societies."
 deity_sawyer:0 "omen_sawyer"
 omen_sawyer:0 "Tom Sawyer and Huck Finn"
 omen_sawyer_desc:0 "#Y Twainist Aspect#!\n\nLesser spirits of the Mississippi, Tom Sawyer and Huck Finn are often seen traveling along the Mississippi and her tributaries, in search of adventure."
 
 


 

