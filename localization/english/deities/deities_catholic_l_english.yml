 omen_joan_of_arc_desc:0 "#Y Christian Saint#!\n\nThe patron saint of France, Jeanne D'Arc recieved divine visions, becoming a military commander during the Hundred Years' War. She was accused of blasphemy and witchcraft, and for that she was burned alive by the English."
 omen_joan_of_arc_twainist:0 "Joan of Arc"
 omen_joan_of_arc_desc_twainist:0 "#Y Christian Saint#!\n\nJoan of Arc defended her country from the invading English, and although her efforts were not enough, she stands as the example of a chivalrous, noble and dedicated person."

 

