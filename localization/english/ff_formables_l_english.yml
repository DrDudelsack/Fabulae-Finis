l_english:

 ## Formables ##
 form_hudsonia:0 "Form Hudsonia"
 form_hudsonia_desc:0 "The many peoples and faiths of the Hudson lay separate and divided. If only one were to take to take up the sword, and unite this rich land...\n\nUpon forming #Y Hudsonia#!, we will have the choice to move our capital."
 HDD:0 "Hudsonia"
 HDD_ADJ:0 "Hudsonian"
 hudsonia_does_not_exist:0 "#Y Hudsonia#! does not exist."
 hudsonia_claims_tooltip:0 "Hudsonia will gain claims on the region of #Y Hudsonia#! and the province of #Y Buffalo#!."
 
 form_lwizyan:0 "Form Lwizyan"
 form_lwizyan_desc:0 "Once ruled by venerable and mighty kings, from the mighty Lanpero Napoleon, to the champion of the people, Rwa Long, the swamps and bayous of Lwizyan stand in comparison to no other. The Pelican State must be reunited!"
 LWZ_NAME:0 "Lwizyan" 
 LWZ_ADJ:0 "Lwizyanais"
 lwizyan_does_not_exist:0 "#Y Lwizyan#! does not exist."
 lwizyan_claims_tooltip:0 "Lwizyan will gain claims on the region of #Y Lwizyan#!."
 ## Formable Events ##
 ff_formable_event_1_t:0 "A New Capital?"
 ff_formable_event_1_desc:0 "Now that the lands of the Hudson has been brought under our control, there is talk amongst the nobles in our court of a new capital. In times of old, all of Hudsonia was ruled from the capital city of [GetProvince('(int32)6678').GetName].\n\nThere is certainly some benefits to relocating here, however our current capital could be spruced up."
 ff_formable_event_1.a:0 "I'm sure [GetProvince('(int32)6678').GetName] is nice, but I like [ROOT.GetCountry.GetCapital.GetName] more."
 ff_formable_event_1.b:0 "A new capital for a new kingdom!"
 ## Extra ##

 form_upper_louisiana:0 "Form Haute-Louisiane"
 form_upper_louisiana_desc:0 "Long ago, the lands of Missouri, Illinois, and Indiana were ruled by a mighty Emperor of the French, all united under the name of Haute-Louisiane.Times have changed, and few remember this long gone realm but ourselves. Let us restore this legendary land!"
 formable_not_upper_louisiana_exists:0 "#Y Haute-Louisiane#! does not exist."
 UPPER_LOUISIANA_NAME:0 "Haute-Louisiane"
 UPPER_LOUISIANA_ADJECTIVE:0 "Haute-Louisianais"
 form_upper_louisiana_claims_tooltip:0 "Haute-Louisiane will get claims on the regions of #Y Missouri#!, #Y Indiana#!, and on the areas of #Y Vincennes#! and #Y Evansville#!."

 form_missouri_rhineland:0 "Form the Missouri Rheinland"
 form_missouri_rhineland_desc:0 "The rich Missouri Rheinland has fed many farms and vineyards throughout the ages. All of Missouri's most important cities lay in this region - why should it not be unified under a Weinstrasser banner?"
 formable_not_missouri_rhineland_exists:0 "#Y Missouri Rheinland#! does not exist."
 MISSOURI_RHINELAND_NAME:0 "Rheinland"
 MISSOURI_RHINELAND_ADJECTIVE:0 "Rheinländer"
 form_missouri_rhineland_claims_tooltip:0 "Rheinland will get claims on the regions of #Y Missouri#!."

 form_boonslick:0 "Form Boonslick"
 form_boonslick_desc:0 "In times of yore, this area was settled by an explorer named Boone, and was thus named Boonslick, or Boone's Lick. Boonslick has always been a key path on the road to the west, and a single ruler could administer this area much better than several."
 formable_not_boonslick_exist:0 "#Y Boonslick#! does not exist."
 BOONSLICK_NAME:0 "Boonslick"
 BOONSLICK_ADJECTIVE:0 "Boonslicker"
