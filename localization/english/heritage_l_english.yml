 ## Tag Specific ##
 new_orleans_heritage:0 "Nolan Heritage"
 new_orleans_heritage_desc:0 "Located at the mouth of the great river, New Orleans is most important port city on the Missisippi, with goods from all parts of America leaving her docks. New Orleans has always been a melting pot of many different cultures and faiths- French, Spanish, Vietnamese, and Italian, to name but a few. The current administration in the city is composed of various merchant families who came together after The Event, forming a republican government. The Nolan people are notorious revelers, and have a practice of throwing a grand parade and celebration every year on Mardi Gras, 'Fat Tuesday'."
 kentucky_heritage:0 "Heritage of the Riverlands Command"
 kentucky_heritage_desc:0 "A remnant of the U.S. Army Riverlands Command, the 'Commonwealth' of Kentucky is less of a kingdom and more so one giant military occupation zone. Only the ruling nobles follow the Americanist ways, and many native Kentuckians resent the green-clad GIs who occupy their home. This arrangement has led to an 'army with a state' philosphy, with the various generals being as, if not more influential than the de-facto elected officals. However, few can deny the strong standing Kentucky has. Their elite soldiers are matched by none, and they have used this to prop up nearby Americanist realms in the region, such as Cinncinatti."
 #East Coast
 seven_nations_heritage:0 "Heritage of the Seven Nations"
 seven_nations_heritage_desc:0 "Emerging as a powerful political entity after The Event, the Seven Nations are a confederacy of the Mohawk, Oneida, Onondaga, Cayuga, Senece, Tuscarora, and recently, the Upstater 'Yankee' Nation, as they are referred to by the Haudensaunee. This arrangement has allowed the confederacy to control important trade routes, and they are often used as middlemen for trade and diplomacy alike."
 mohawk_heritage:0 "Heritage of the Mohawk Warriors"
 mohawk_heritage_desc:0 "Central to the mythology of the post-Event Mohawk is the fabled 'Mohawk Warrior Society', an order of noble men who fought for the defense of the Mohawk people, thus securing their independence in the face of hostile neighbors. They are a fierce and warlike people, frequently raiding up and down the St. Lawrence. A common practice of theirs is the 'Mourning War', where in order to right any wrongs, the Haudenosaunee raid their rivals to capture people to be adopted into the tribe. They are famed for the manner in which Mohawk men style their hair; they pluck or shave most of their hair until only a thin strip is left, which is styled in many different fashions."
 three_mile_heritage:0 "Heritage of the Three-Mile Fortress"
 three_mile_heritage_desc:0 "The zealous and stalwart Fissionist have made their capital at the old Reactor of Three-Mile, which has since been turned into a nigh impregnable fortress. Viewed with suspicion by many, even by the other Industrialist groups, the Atomic Kingdom has for now, retreated to their defenses, determined to weather the oncoming storm."
 syracuse_heritage:0 "Heritage of the Rose-Cross"
 syracuse_heritage_desc:0 "Taking power of the city of Syracuse in 2328, after the untimely death of the wicked Dionysus Harpur, the mysterious Order of the Rose Cross, or 'Rosicrucians' are shrouded in mystery. Some say they originate in Chicago, or even as far away as the distant lands of California. Wherever their origins may lay, they are extremly seclusive, rarely revealing themsleves beyond what is deemed neccesary. This order of the Rose Cross has pursued a strategy of expansion against their neighbors, namely against the son of the late Dionysus, Dionysus II."
 utica_heritage:0 "Heritage of Harpur's Redoubt"
 utica_heritage_desc:0 "After the death of Dionysus Harpur in 2328, a young and inexperienced.Dionysus II was thrust onto the throne. While Syracuse and her envirions have been lost, the Harpur dynasty has stubbornly protected Utica, now guarded by huge walls and a citadel, which have been dubbed 'Harpur's Redoubt'. Only Fate knows if if the Harpurs manage to force out the Rosicrucian invaders..."
 #Georgia
 sparta_heritage:0 "Heritage of the Dixie Jailors"
 sparta_heritage_desc:0 "A small town in the middle of Georgia, Sparta has become infamous for its use of forced labour. Surrounded by richer states, they have been able to keep their independence due to this labour pool and their emphasis on military affairs. At the center of the city lies the Hancock County Courthouse, called 'Her Majesty' by the Spartans, but called as the ticket to prison by other states in the area."
 athens_heritage:0 "Athens Heritage"
 athens_heritage_desc:0 "The Athenians pride education and democracy above all else. Attracting scholars and scientists from all over the south, the University of Georgia has remained a place of congregation. Since The Event, the University has also doubled as a meeting place for direct democracy, where all can voice their opinions to the whole town, whether they should have a voice or not."
 savannah_heritage:0 "Heritage of the Gullah-Geechee League"
 savannah_heritage_desc:0 "The city of Savannah and her islands just east form the beginnings of what is sometimes called as the Gullah-Geechee league. The Gullah, after The Event, would dominate the marshlands of the Georgian coast and developped into many small polities. The difficult, marshy waters and network of islands have produced a caste of skilled fisherman and navigators. Now united into a league, the Gullah lands are near impregnable, lest one dares to cross the salt-marsh waters."
 #Missouri
 como_heritage:0 "Heritage of Chancellor Choi"
 como_heritage_desc:0 "The Choi Dynasty has been in power of Como since The Event. No one knows where the founder, Mun Choi, comes from. Some say from as far as New England, others say as close as Chicago, and others still say from a distant and long-forgotten land beyond the shores of California. Regardless, under his reign he transformed Como into what was a democracy into an absolute kingdom, centralizing his rule into the President-Chancellory we are familiar with today. Since then, his descendents have aggressively conquered lands as far as Rolla and became one of the pre-imminent states in the whole of Missouri. Located right in the center of it all, the Choi Dynasty continues to play a pivotal role in Missourian politics, from Kaycie to St. Louis."
 truman_heritage:0 "Kirksville Heritage"
 truman_heritage_desc:0 "The capital of Kirksville, located in the desolate Missouri north, quickly became a dominating power in a land generally devoid of centralized polities. Truman University became a source of legitimacy and cultural prestige, ultimately resulting in Kirksville's capture of Route 63 and management of Route 63, a lucrative traderoute that carries goods from Missouri's south to Idaho and beyond."
 st_louis_heritage:0 "Heritage of the Busch Dynasty"
 st_louis_heritage_desc:0 "St. Louis, the Gateway to the West has been ruled by the Promethean Busch dynasty for as long as anyone has known. While the Busch Titans amass vast amounts of wealth from their beer enterprises, the common man in their city languishes under their oppressive rule. Perhaps it is time for a change of leadership.."
 frenchville_heritage:0 "Heritage of Those Who Speak 'French'"
 frenchville_heritage_desc:0 "The story of the Frenchvillois, or 'Frentshveelwa' as they refer to themselves, is an exceedingly strange one. Originating from the town of Frenchville, they claim to speak a kind of French, supposedly one that was existing in the town pre-Event, although no one can make any sense of it. Sometime around 2350, they managed to seize the neighboring lands around them, imposing their language against them. Although the Frenchvillois are few in number, they are very tenacious, and have proven to be a massive thorn in the side of the Alleghenian kings."

 ## Culture Groups ##
 mid_atlantic_heritage:0 "Mid-Atlantic Heritage"
 mid_atlantic_heritage_desc:0 "The bustling city states and kingdoms of the Mid-Atlantic are prolific merchants, importing goods from as far away as the distant lands of Brazil. Much like their ancient forefathers, they are quick to a fight, although these days it is usually against their own kin, rather than the tyrannical Redcoats of yore. They are proud of their republican legacy, and even if they are not a republic in name, many traditions and institutions of the old America have been carried down throughout the ages."
 steelfolk_heritage:0 "Steelfolk Heritage"
 steelfolk_heritage_desc:0 "The people of the old Rust Belt of the United States are a hardy, industrious sort. They value community, hard work, and collective labor. They tire endlessly to recreate the lost image of the old world, that fleeting mirage before the Great Rusting. Perhaps one day, they will reach this lofty goal."
 midwestern_heritage:0 "Midwestern Heritage"
 midwestern_heritage_desc:0 "Encompassing the vast plains of the Midwest, the Midwesterners are descendants of settlers from long ago, from the land across the sea. Their many cities dot the prairies, a monument to the homesteading nature of these peoples."
 californian_heritage:0 "Californian Heritage"
 californian_heritage_desc:0 "California is a land of many peoples and creeds, and also a land of great wealth and prosperity. It is for this reason that California has become the picking ground for vultures - oppourtunistic warlords who prey on the flesh of the grizzly. If only one of their own would unite them..."
 frontieran_heritage:0 "Frontieran Heritage"
 frontieran_heritage_desc:0 "Inhabiting the great deserts of the west, Frontierans are no stranger to harsh terrain they live in. While the desert isn't the easiest place to live in, it is important for many trade routes, especially for those from California."
 yankee_heritage:0 "Yankee Heritage"
 yankee_heritage_desc:0 "As the old adage goes, 'To Northerners, a Yankee is an Easterner. To Easterners, a Yankee is a New Englander. To New Englanders, a Yankee is a Vermonter. And in Vermont, a Yankee is somebody who eats pie for breakfast.' Yankees are famous for their Puritan work ethic, their populous urban centers, and of course the small rural communities that form the centerpiece of Yankee culture."
 northlake_heritage:0 "Northlake Heritage"
 northlake_heritage_desc:0 "Shaped by the Great Lakes that these people make their homes next to, many amongst them have taken up to raiding the shores of the rich Promethean Titantes, and as far east as New York. And yet many of these people remain sedentary farmers, working the earth for a living."
 laurentian_heritage:0 "Laurentian Heritage"
 laurentian_heritage_desc:0 "Residing in a dense, urbanized region, the Laurentians group themselves into many different city states and leagues. They are quick to band together for mutual defense, but their disorganized and loose governments make large-scale expansion difficult."
 old_southern_heritage:0 "Old Southern Heritage"
 old_southern_heritage_desc:0 "A deeply chivalric and equestrian people, the Old Southerners are famed for their heavy cavalry, and rich urban centers."
 deep_southern_heritage:0 "Deep Southern Heritage"
 deep_southern_heritage_desc:0 "The Deep South is a divided land, split up amongst many warlords of varying faiths. Their despotic warlords reap the benefits, while the populace suffers from their rule."
 upland_heritage:0 "Upland Heritage"
 upland_heritage_desc:0 "The Uplander way of life is defined by two things: their neighbors, who are constantly trying to invade and conquer their lands, and the many rivers that permeate Uplander territories. These rivers help to facilitate trade, and the frequent raids that Uplanders are known to conduct."
 texan_heritage:0 "Texan Heritage"
 texan_heritage_desc:0 "By nature a martial and warlike people, the Texans do not need much of an excuse for a fight. However all this fighting leaves a lot less time for more intellectual pursuits..."
 deutschamerikaner_heritage:0 "Deutschamerikaner Heritage"
 deutschamerikaner_heritage_desc:0 "The Deutschamerikaner are descendants of the people known as 'Germans', who immigrated to the lands of America in pre-Event times. They are known for their skill in manufacturing, construction, and resourcefulness in business ventures."
 canayen_heritage:0 "Canayen Heritage"
 canayen_heritage_desc:0 "The French speaking Canayen are overwhelmingly dominated by their rich aristocracy and clergy. Despite their fractured nature, they have been more than capable of standing against a foe many times their strength and size. To say they are proud of their independence would be an understatement."
 sioux_heritage:0 "Sioux Heritage" 
 sioux_heritage_desc:0 "The undisputed masters of the Great Plains, the many Siouan groups have rebounded to the position of power that they held many ages ago. Although altered by time, the proud and martial Sioux have a long heritage of equestrianism, archery, and using the land to it's fullest extent. As the scourge of their more settled neighbors, as the fearsome Sioux are not well liked by most peoples, and there are divisions even amongst themsleves."

 ## Cultures ## 
 hudsonian_heritage:0 "Hudsonian Heritage" 
 hudsonian_heritage_desc:0 "Living near the fertile Hudson river, the Hudsonians use the river to their full advantage, trading with the metropolises downriver, and farming along the banks of the Hudson."
 upstater_heritage:0 "Upstater Heritage"
 upstater_heritage_desc:0 "The Upstaters are defined primarily by the complex webs of alliances which they often find themselves in, and their many and varied religious practices. It is usually charismatic leaders who push these religions, sometimes at their own expense."
 appalachian_heritage:0 "Appalachian Heritage"
 appalachian_heritage_desc:0 "Primarily mountain-dwellers, the Appalachian tribes are regarded as strange and foreign by many. In their distant hollers, there is talk of dark and occult gods being worshipped..."
 gatewayan_heritage:0 "Gatewayan Heritage"
 gatewayan_heritage_desc:0 "Living at the confluence of the Missisippi, Missouri, and Illinois rivers, the Gatewayans are prolific merchants and sailors, peddling their goods up and down the Missisippi."
 heartlander_heritage:0 "Heartlander Heritage"
 heartlander_heritage_desc:0 "Their lands are called the 'Heart of the Midwest', for the amount of food they grow, but also the humble and handy nature of their people."
 grangelander_heritage:0 "Grangelander Heritage"
 grangelander_heritage_desc:0 "The thundering of Grangelander horses is often heard on the vast, desolate plains that they call home. Sedentary settlement is rare, as their way of life makes settling down difficult."
 minnesotan_heritage:0 "Minnesotan Heritage"
 minnesotan_heritage_desc:0 "Generally well liked by their neighbors, the Minnesotans are known for their hospitality. They generally prefer to settle things diplomatically, although they have no qualms taking up arms, especially if it is against the despised Cheeseheads. The headwaters of the Missisippi is found in their nation, which allows them to concentrate in large settlements. Their two largest cities, Minneapolis and St. Paul are built on the banks of this river."
 northlander_heritage:0 "Northlander Heritage"
 northlander_heritage_desc:0 "The Northlanders inhabit a cold and windswept area, mostly devoid of trees. They are skilled horsemen, riding to other lands in search of food, gold, or people. They are no stranger to the cold, and their people can tolerate abominable temperatures. It is a practice among them to see who can wear the least amount of furs during the wintertime - a test of who is the stronger warrior."
 yooper_heritage:0 "Yooper Heritage"
 yooper_heritage_desc:0 "The Yoopers inhabit a peninsula of the same name; there is some debate as to whether they gave the name to it, or the other way around. Like most cultures living near the Great Lakes, they have taken to indiscriminate raiding as a way of life. The dense woodlands of Yoopland are home to sizable copper and iron mines. The Yoopers say that these mines have been operating since even before the Event, although the truth of this is uncertain. They are intensely superstitious, sticking only to their gods."
 kermesseais_heritage:0 "Kermesseais Heritage"
 kermesseais_heritage_desc:0 "Descendants of Quebecois Acadian, and Chiac migrants who came to New England during the Great Migration, the Kermesseais or, 'those of the fair', are known for their vibrant celebrations, hardworking attitude, and staunch belief in their faith. The Kermesseais tongue is a 'Franglish', or mix of New-England French and the Anglic Yankee tongue. Both Quebecois and Yankee view the Kermesseais way of speaking strangely, as it is so similar and yet so different from their languages."
 haudenosaunee_heritage:0 "Haudenosaunee Heritage"
 haudenosaunee_heritage_desc:0 "The Haudenosaunee, or 'People of the Longhouse' are renowned for their political institutions, which have been as long standing as the people themselves. They are loosely organized into a greater league, although some members are functionally independent and operate outside the confederacy."
 louisianais_heritage:0 "Louisianais Heritage"
 louisianais_heritage_desc:0 "Formed from an ethnogenesis of the Cadjin and Creole cultures, the Louisianais have enjoyed an unexpected revival in the wake of the wake of the Event. Inhabiting the southermost forest and swamplands of Louisiana, They are known for their fearsome Mardi-Gras riders, heavy cavalry adorned in garish colors of purple, yellow, and green."
 
 
 












































 hellenistic_heritage:0 "Hellenistic Heritage"
 hellenistic_heritage_desc:0 "While Greek settlers have traveled east for generations before Alexander it was his conquest of the Achaemenid empire that led to the creation of eastern Greek states. The fusion of Persian and Greek culture that Alexander tried to foster now lives on as an undisputed Hellenistic heritage."
 arsacid_dahae_heritage:0 "Dahae Heritage"
 arsacid_dahae_heritage_desc:0 "Our people prides itself with its great skill as riders and its horsemanship. Nobles and commoners alike learn to ride at an early age and as a consequence the force of our cavalry arm can make the strongest of empires tremble. A pastoral lifestyle has made many accustomed to a free way of life however, fostering an autonomous mode of government where chieftains and nobles have great say over their own business."
 
 seafaring_heritage:0 "Seafaring Heritage"
 seafaring_heritage_desc:0 "The heritage of this people has been associated with navigating the open seas for generations. Some say their ancestors came here from faraway lands, others that they have welcomed sailors that sought out their ports."
 pirate_heritage:0 "Pirate Heritage"
 pirate_heritage_desc:0 "Some would say that the ancestors of this people were pirates and plunderers, always ready to profit from the misfortune of others. That is, however, a matter of perspective. A strong adventuring spirit along with a love for the open sea is the heritage that binds this people together."
 coastal_heritage:0 "Coastal Heritage"
 coastal_heritage_desc:0 "While they never became great seafarers this people have always been dependent on what the sea brings them for their wealth and prosperity. A heritage of trade and bartering is the core around which their culture revolves."
 river_plain_heritage:0 "Heritage of the River Plains"
 river_plain_heritage_desc:0 "The fertile plains around great rivers have given birth to many civilizations over the centuries. This people's heritage is closely tied to farming the land of the river plains in which they originated."
 steppe_heritage:0 "Steppe Heritage"
 steppe_heritage_desc:1 "The wide open grasslands of the north have been the home of this people for generations and the harsh life of the steppes has completely shaped their heritage and society at large."
 rural_heritage:0 "Rural Heritage"
 rural_heritage_desc:0 "Life in the plains, fields and pastures has shaped this people into what it is. Over time these farmers and shepherds have constructed cities, roads and bridges but at their heart they still value a life in the countryside."
 montane_heritage:0 "Montane Heritage"
 montane_heritage_desc:0 "The mountainous landscapes in which this people originated has shaped their heritage of fierce independence and self determination. Some would say that their strong sense of self defense can even make them see enemies where there were only friends, but their awareness of how they can survive and defend themselves in hostile terrain has served them well over the centuries."
 desert_heritage:0 "Desert Heritage"
 desert_heritage_desc:0 "The ancestors of this people have traversed open deserts for many generations and over time built traditions and an almost instinct based understanding for how to survive and thrive among the hot dunes. Whether the objective is to build an empire of the sands or to traverse a desert in search of new homes there are few who would find this task as natural as those of this heritage."
 jungle_heritage:0 "Jungle Heritage"
 jungle_heritage_desc:0 "Over the centuries this people has made nature their fortress. The deep jungles and the creatures that dwell within them are their allies, their foes and the principal asset around which they organize their defenses."
 forest_heritage:0 "Forest Heritage"
 forest_heritage_desc:0 "In the forests of their homeland this people has acquired a strong tradition of archery and a long tradition for how to maintain the unity of the disparate tribes that dwelt there."
 marshland_heritage:0 "Marshland Heritage"
 marshland_heritage_desc:0 "People accustomed to marshes and wetlands once built this state. In this environment they acquired great experience in asymmetrical warfare as well as in how to turn land that some would consider unfit for living into a prosperous garden."
 highland_heritage:0 "Highland Heritage"
 highland_heritage_desc:0 "The heritage of this people was once forged in the open highlands. To this day they remain more well versed than most in the construction of stone buildings and fortifications, but they also carry a strong aversion to the open seas."
 #Mission Related
 religious_enclave_heritage:0 "Religious State"
 religious_enclave_heritage_desc:0 "This state was founded by the priesthood of a great temple. To this day they revere the old traditions of their predecessors even if some would say their rule has grown increasingly focused on the temporal world over time."
 #
 default_heritage:0 "Unremarkable Heritage"
 default_heritage_desc:0 "Most peoples have something to be proud of but this is not the case for the citizens of this state. Long forgotten by the outside world they continue to lead uneventful, if peaceful, lives and have no hopes or aspirations of note."



